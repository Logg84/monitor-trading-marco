name: alerts (DISATTIVATO - solo manuale)

# ⚠️ ALERT NON ATTIVI. Per attivarli in futuro, aggiungi sotto "on:" le righe:
#   schedule:
#     - cron: "*/15 8-16 * * 1-5"   # orari Euronext (UTC)
#     - cron: "*/15 14-21 * * 1-5"  # orari NYSE (UTC)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Check alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alert_checker.py

      - name: Commit storico alert
        run: |
          git config user.name "argo-bot"
          git config user.email "argo-bot@users.noreply.github.com"
          git add data/alerts.json
          git diff --cached --quiet || git commit -m "chore: storico alert"
          git push