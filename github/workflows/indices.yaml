name: indices-monthly

on:
  schedule:
    - cron: "0 6 1 * *"   # 1° del mese, 06 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Download indici
        run: python scripts/download_indices.py

      - name: Commit risultati
        run: |
          git config user.name "argo-bot"
          git config user.email "argo-bot@users.noreply.github.com"
          git add data/indices
          git diff --cached --quiet || git commit -m "chore: aggiornamento indici mensile"
          git push