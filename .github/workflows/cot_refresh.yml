name: COT Weekly Refresh

on:
  schedule:
    - cron: '0 8 * * 6'   # sabato 08:00 UTC, dopo l'uscita CFTC di venerdì
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dipendenze
        run: pip install --upgrade pip && pip install pandas numpy requests openpyxl xlrd

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build COT
        run: python cot_build.py

      - name: Commit & push (solo file esistenti)
        run: |
          FILES=""
          [ -f cot_data.json ] && FILES="$FILES cot_data.json"
          [ -f cot_report.html ] && FILES="$FILES cot_report.html"
          if [ -z "$FILES" ]; then
            echo "❌ cot_build.py non ha generato output: leggi il log dello step 'Build COT'."
            exit 1
          fi
          git pull -X ours origin main || true
          git add $FILES
          if git diff --staged --quiet; then
            echo "ℹ️ Nessuna modifica ai dati COT, skip commit."
          else
            git commit -m "chore(cot): refresh settimanale $(date -u +%Y-%m-%d)"
            git push origin main
          fi
