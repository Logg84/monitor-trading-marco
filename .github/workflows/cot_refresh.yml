name: COT Weekly Refresh

on:
  schedule:
    # Sabato 08:00 UTC (CFTC esce venerdì 15:30 ET = 21:30/22:30 UTC)
    - cron: '0 8 * * 6'
  workflow_dispatch:  # trigger manuale dal tab Actions

permissions:
  contents: write

jobs:
  refresh-cot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy openpyxl requests yfinance

      - name: Pull latest (ours strategy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull -X ours origin main || true

      - name: Run COT build
        run: python cot_build.py

      - name: Commit & push
        run: |
          git add cot_data.json cot_report.html
          if git diff --staged --quiet; then
            echo "Nessuna modifica al COT, skip commit."
          else
            git commit -m "chore(cot): refresh settimanale $(date -u +%Y-%m-%d)"
            git pull -X ours origin main || true
            git push origin main
          fi
