name: screening-daily
on:
  schedule:
    # 2 corse complete/giorno lun-ven (UTC):
    # 06:30 → ~8:30 locali: USA consolidati, prepari gli ingressi del pomeriggio
    # 14:30 → ~16:30 locali: fasi finali europee, prepari gli ingressi di domani
    - cron: "30 6,14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Screening tutti gli indici + auto-popolazione + pruning
        run: python scripts/run_screening.py
      - name: Commit risultati
        run: |
          git config user.name "argo-bot"
          git config user.email "argo-bot@users.noreply.github.com"
          git add data/screening_latest.csv data/screening_meta.json data/watchlist.json
          git diff --cached --quiet || git commit -m "chore: screening daily"
          git push
