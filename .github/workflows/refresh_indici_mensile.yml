name: Refresh liste indici mensile

on:
  schedule:
    # Giorno 1 del mese alle 06:00 UTC (dopo lo screening delle 21:30 del giorno prima)
    - cron: "0 6 1 * *"
  workflow_dispatch:   # trigger manuale per test

permissions:
  contents: write      # serve per il commit dei CSV in indices/

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze minime
        run: pip install pandas requests openpyxl lxml

      - name: Scarica liste e push su GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python download_indices.py
