name: Screening automatico giornaliero

on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC ogni giorno (candele daily chiuse EU+USA)
  workflow_dispatch: {}     # avvio manuale

permissions:
  contents: write           # per committare i risultati

concurrency:
  group: screening-giornaliero
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        # data_engine usa pd.read_html (-> lxml/html5lib/bs4) + numpy + yfinance
        run: pip install pandas numpy requests yfinance lxml html5lib beautifulsoup4

      - name: Esegui screening + riconciliazione watchlist
        run: python run_screening.py

      - name: Commit risultati (se cambiati)
        run: |
          git config user.name "screening-bot"
          git config user.email "screening-bot@users.noreply.github.com"
          git add argo_database.json watchlist.csv screener_state.json fundamentals_cache.json
          git diff --staged --quiet || git commit -m "Screening automatico: aggiorna risultati + watchlist auto"
          git pull --rebase origin main
          git push
