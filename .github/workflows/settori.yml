name: settori-eod
on:
  schedule:
    # 21:35 UTC: dopo la chiusura di Wall Street (20:00 UTC d'estate, 21:00 UTC
    # d'inverno). Lun-ven. Se corre troppo presto, la barra del giorno arriva
    # parziale: il campo market_open_bar del file lo dichiara.
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
    inputs:
      notifica:
        description: "Invia anche il digest di rotazione su Telegram"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Snapshot settori (chiusura)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # NB: niente && / ||: nelle espressioni di Actions le stringhe vogliono
          # gli apici singoli e comunque qui non serve — il booleano arriva già
          # come true/false (e vuoto da cron). Lo interpreta il script.
          SETTORI_NOTIFICA: ${{ inputs.notifica }}
        run: python scripts/update_sectors.py
      - name: Commit della cache
        run: |
          git config user.name "argo-bot"
          git config user.email "argo-bot@users.noreply.github.com"
          git add data/sectors_latest.json
          git diff --cached --quiet || git commit -m "chore(settori): snapshot di chiusura"
          git push
