name: Aggiorna indici mensilmente

on:
  workflow_dispatch:

  schedule:
    # Ore 06:30 UTC del giorno 1 di ogni mese
    - cron: "30 6 1 * *"

permissions:
  contents: write

jobs:
  aggiorna-indici:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggiorna costituenti indici
        run: |
          python scripts/download_indices.py --force --max-age-days 0

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/indices || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da commitare"
          else
            git commit -m "Aggiornamento mensile costituenti indici"
            git push
          fi
