name: Controllo alert prezzi

on:
  schedule:
    - cron: "0 * * * *"  # ogni ora, 24/7 (UTC) — trading di medio periodo
  workflow_dispatch: {}       # permette anche l'avvio manuale da GitHub

permissions:
  contents: write  # necessario per fare commit di alert_state.json

concurrency:
  group: controllo-alert-prezzi
  cancel-in-progress: false  # in coda, non annulla un run già in corso

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install pandas requests mplfinance yfinance

      - name: Esegui controllo alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python alert_checker.py

      - name: Commit stato alert (se cambiato)
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add alert_state.json alert_history.csv prezzi_attuali.json
          git diff --staged --quiet || git commit -m "Aggiorna stato e storico alert"
          git pull --rebase origin main
          git push
